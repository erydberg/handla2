name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: ./mvnw -B verify

      # Bygger och pushar ghcr.io/erydberg/handla2:<pom-version> (+ latest och commit-sha) med Jib.
      # GITHUB_TOKEN räcker, ingen personlig nyckel behövs.
      - name: Build and push image
        if: github.event_name != 'pull_request'
        run: >
          ./mvnw -B -DskipTests jib:build
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
          -Djib.to.tags=latest,${GITHUB_SHA::7}
