<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="sv">
<head>
    <th:block th:insert="~{fragments/header :: header}"></th:block>
    <title>Handlaappen - användare</title>
</head>
<body>
<div class="nav-box">
<span class="toolbar">
    <a class="toolitem" th:href="@{'/'}"><img th:src="@{/styles/back.png}"></a>
    <a class="toolitem" th:href="@{'/users/new'}"><img th:src="@{/styles/user.png}"></a>
</span>
    <h1>Handlaappens användare</h1>
</div>
<div class="errorblock" th:if="${error_message}">
    <p th:text="${error_message}"></p>
</div>
<div class="successblock" th:if="${message}">
    <p th:text="${message}"></p>
</div>
<div class="notepad">
    <ul class="list">
            <li  th:each="handlaUser: ${users}">
                <a th:href="@{'/users/edit/' + ${handlaUser.id}}" th:text="${handlaUser.username}"></a>
                <form method="post" th:action="@{'/users/delete/' + ${handlaUser.id}}" class="del inline-form" onsubmit="return confirm('Vill du ta bort användaren?')"><button type="submit" class="link-button"><img th:src="@{/styles/delete.png}"></button></form>
            </li>
    </ul>
</div>
</body>
</html>
